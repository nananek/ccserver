name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node versions are the supported range, not a preference: 22 is Maintenance
  # LTS (until 2027-04-30), 24 is Active LTS, and 26 is Current -- it becomes
  # Active LTS on 2026-10-28, and is what this project is developed on, so
  # leaving it untested is how `engines: >=22.13` came to promise more than CI
  # ever checked. Dates from nodejs/Release schedule.json, read 2026-09-24.
  unit-tests:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every version's result matters; one failing must not cancel the others.
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all server sources
        run: |
          find server \( -name '*.js' -o -name '*.cjs' \) -not -path '*/node_modules/*' -print0 \
            | xargs -0 -P4 -n1 node --check

      - name: Validate sandbox.config.example.json
        run: node -e "JSON.parse(require('fs').readFileSync('server/sandbox.config.example.json', 'utf-8'))"

      # Issue #201. Seeds a decoy at every location server/paths.js can name on
      # this runner -- both the pre-migration paths and the XDG targets -- so a
      # test that resolves a REAL host path instead of a scratch one fails the
      # build instead of going unnoticed. Six test files did exactly that on the
      # #201 branch, and every one was found by doing this by hand.
      - name: Seed host-path canaries
        run: node server/tools/path-canary.js place

      - name: Run unit tests
        run: npm test

      # always(): a suite failure must not hide a path violation, and a path
      # violation is usually the more important of the two.
      - name: Verify the canaries survived
        if: always()
        run: node server/tools/path-canary.js verify

  # Matrixed too: the build toolchain (vite/rollup/esbuild) is where a new Node
  # breaks first, and at ~20s a leg the whole matrix costs less than a minute.
  client-build:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build --workspace=client

  # Issue #221 step 0. docs.yml builds docs-site only on a push to master that
  # touches docs-site/**, so until this job existed the site was never built for
  # a pull request: a change that breaks the docs merged green, and a PR that
  # rewrites the docs wholesale (which #221 is) had nothing verifying it.
  #
  # Here rather than as a pull_request trigger on docs.yml, because that
  # workflow's build job is wired to deployment -- it configures Pages, uploads
  # a Pages artifact, and feeds a deploy job in the github-pages environment,
  # under `concurrency: group: pages`. Running that on PRs would put PR builds
  # in the same concurrency group as real deploys. This job only builds.
  #
  # Unconditional, not filtered on docs-site/**. The build is ~16s locally
  # (8s npm ci + 8s astro build), which is about what one client-build leg
  # costs and a twentieth of e2e, so a filter would buy very little. What it
  # would cost is the case the filter cannot see: docs-site is self-contained
  # today (no symlinks, no reads outside its own tree, its own lockfile), and a
  # path filter would silently bake that assumption in -- the day someone
  # generates a page from a file in the repo root, the filter stops covering it
  # without anyone noticing. That is the failure mode #223 was about.
  #
  # Node 22 and not matrixed: this checks that the docs still build, and
  # docs.yml deploys on 22, so 22 is the version that has to keep working.
  docs-build:
    name: Docs build (docs-site)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job only reads the repo and builds; nothing it does needs write
    # access. The other jobs in this file inherit the repository default the
    # same way -- tightening those is a separate change, not folded in here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # docs-site is a separate npm project with its own lockfile; the
          # default would key the cache on the root one and `npm ci` below
          # would not be covered by it.
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs-site
        working-directory: docs-site
        run: npm run build

  # Deliberately NOT matrixed. It is by far the most expensive job (~3m30s plus
  # a browser download) and the least discriminating for a Node difference: it
  # exercises the browser/server seam, and anything a Node version changes in
  # the server is caught first by the ~1900-test unit suite above. Pinned to
  # the floor the project promises (the oldest supported version), so "it works
  # on the minimum we claim" stays covered.
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build client
        run: npm run build --workspace=client

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
