name: CI

on:
  push:
    # TEMPORARY (removed in the next commit): this branch is listed so the
    # new job below gets a real CI run to be verified against, without
    # opening a PR for it.
    branches: [master, ci/sandbox-backend-job]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node versions are the supported range, not a preference: 22 is Maintenance
  # LTS (until 2027-04-30), 24 is Active LTS, and 26 is Current -- it becomes
  # Active LTS on 2026-10-28, and is what this project is developed on, so
  # leaving it untested is how `engines: >=22.13` came to promise more than CI
  # ever checked. Dates from nodejs/Release schedule.json, read 2026-09-24.
  unit-tests:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every version's result matters; one failing must not cancel the others.
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all server sources
        run: |
          find server \( -name '*.js' -o -name '*.cjs' \) -not -path '*/node_modules/*' -print0 \
            | xargs -0 -P4 -n1 node --check

      - name: Validate sandbox.config.example.json
        run: node -e "JSON.parse(require('fs').readFileSync('server/sandbox.config.example.json', 'utf-8'))"

      # Issue #201. Seeds a decoy at every location server/paths.js can name on
      # this runner -- both the pre-migration paths and the XDG targets -- so a
      # test that resolves a REAL host path instead of a scratch one fails the
      # build instead of going unnoticed. Six test files did exactly that on the
      # #201 branch, and every one was found by doing this by hand.
      - name: Seed host-path canaries
        run: node server/tools/path-canary.js place

      - name: Run unit tests
        run: npm test

      # always(): a suite failure must not hide a path violation, and a path
      # violation is usually the more important of the two.
      - name: Verify the canaries survived
        if: always()
        run: node server/tools/path-canary.js verify

  # The unit-tests matrix above runs WITHOUT a sandbox backend, and that is
  # load-bearing rather than incidental: ubuntu runners ship no bwrap, so those
  # legs are what exercise every "no backend available" path. It is not a gap
  # to be closed. PR #259 shipped three assertions that only execute when bwrap
  # is absent, they were stale, and the no-bwrap legs are the only thing that
  # caught them -- the author's host and the review host both had bwrap and
  # both went green.
  #
  # What was missing is the OTHER condition. Tests that branch on
  # sandboxAvailable() have a second half -- "the session really is built and
  # really runs sandboxed" -- which is the half every real deployment takes,
  # and nothing ran it. So this job ADDS a condition instead of replacing one:
  # the same suite, once with a backend and once without. Deleting either side
  # loses real coverage.
  #
  # Deliberately not matrixed over Node. This job varies the sandbox backend,
  # not the Node version; the matrix above already answers the Node question,
  # and tripling this would buy three bwrap installs to re-answer it. Pinned to
  # 22, the oldest version the project claims, matching the e2e job.
  unit-tests-sandbox:
    name: Unit tests (server, bwrap backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bubblewrap
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 gates unprivileged user namespaces behind AppArmor
          # (kernel.apparmor_restrict_unprivileged_userns), which bwrap needs.
          # Relaxed only when the plain invocation actually fails, so the log
          # records which of the two configurations this runner required
          # instead of hiding it behind an unconditional sysctl.
          if bwrap --ro-bind / / --dev /dev --proc /proc true; then
            echo "bwrap usable as installed"
          else
            echo "relaxing kernel.apparmor_restrict_unprivileged_userns for bwrap"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Presence is not usability, and this job is worthless if it silently
      # degrades into a second copy of the no-backend matrix above. Both facts
      # are asserted: sandboxAvailable() (which only stats /usr/bin/bwrap, and
      # is what selects the success branch in the tests) and a real bwrap
      # execution. A runner where either regresses fails here, loudly, rather
      # than reporting green over coverage it did not actually provide.
      - name: Assert the sandbox backend is really available
        run: |
          set -eux
          bwrap --ro-bind / / --dev /dev --proc /proc true
          node --input-type=module -e "
            import { sandboxAvailable, sandboxBackend } from './server/ws/sandbox.js';
            console.log('sandboxBackend():', sandboxBackend());
            if (!sandboxAvailable()) {
              console.error('FATAL: sandboxAvailable() is false -- this job would duplicate the no-backend matrix');
              process.exit(1);
            }
          "

      - name: Seed host-path canaries
        run: node server/tools/path-canary.js place

      - name: Run unit tests
        run: npm test

      - name: Verify the canaries survived
        if: always()
        run: node server/tools/path-canary.js verify

  # Matrixed too: the build toolchain (vite/rollup/esbuild) is where a new Node
  # breaks first, and at ~20s a leg the whole matrix costs less than a minute.
  client-build:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build --workspace=client

  # Issue #221 step 0. docs.yml builds docs-site only on a push to master that
  # touches docs-site/**, so until this job existed the site was never built for
  # a pull request: a change that breaks the docs merged green, and a PR that
  # rewrites the docs wholesale (which #221 is) had nothing verifying it.
  #
  # Here rather than as a pull_request trigger on docs.yml, because that
  # workflow's build job is wired to deployment -- it configures Pages, uploads
  # a Pages artifact, and feeds a deploy job in the github-pages environment,
  # under `concurrency: group: pages`. Running that on PRs would put PR builds
  # in the same concurrency group as real deploys. This job only builds.
  #
  # Unconditional, not filtered on docs-site/**. The build is ~16s locally
  # (8s npm ci + 8s astro build), which is about what one client-build leg
  # costs and a twentieth of e2e, so a filter would buy very little. What it
  # would cost is the case the filter cannot see: docs-site is self-contained
  # today (no symlinks, no reads outside its own tree, its own lockfile), and a
  # path filter would silently bake that assumption in -- the day someone
  # generates a page from a file in the repo root, the filter stops covering it
  # without anyone noticing. That is the failure mode #223 was about.
  #
  # Node 22 and not matrixed: this checks that the docs still build, and
  # docs.yml deploys on 22, so 22 is the version that has to keep working.
  docs-build:
    name: Docs build (docs-site)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job only reads the repo and builds; nothing it does needs write
    # access. The other jobs in this file inherit the repository default the
    # same way -- tightening those is a separate change, not folded in here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # docs-site is a separate npm project with its own lockfile; the
          # default would key the cache on the root one and `npm ci` below
          # would not be covered by it.
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs-site
        working-directory: docs-site
        run: npm run build

  # Deliberately NOT matrixed. It is by far the most expensive job (~3m30s plus
  # a browser download) and the least discriminating for a Node difference: it
  # exercises the browser/server seam, and anything a Node version changes in
  # the server is caught first by the ~1900-test unit suite above. Pinned to
  # the floor the project promises (the oldest supported version), so "it works
  # on the minimum we claim" stays covered.
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build client
        run: npm run build --workspace=client

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
